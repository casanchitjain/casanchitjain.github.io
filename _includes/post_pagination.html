{% include base_path %}

{% if page.previous or page.next %}
  <nav class="pager" aria-label="More {{ page.collection | default: 'pages' }}">
    {% if page.previous %}
      <a class="pager__link pager__link--prev" href="{{ base_path }}{{ page.previous.url }}" rel="prev">
        <span class="pager__label"><span aria-hidden="true">&#8249;</span> Previous</span>
        <span class="pager__title">{{ page.previous.title | markdownify | strip_html | strip }}</span>
      </a>
    {% else %}<span></span>{% endif %}
    {% if page.next %}
      <a class="pager__link pager__link--next" href="{{ base_path }}{{ page.next.url }}" rel="next">
        <span class="pager__label">Next <span aria-hidden="true">&#8250;</span></span>
        <span class="pager__title">{{ page.next.title | markdownify | strip_html | strip }}</span>
      </a>
    {% endif %}
  </nav>
{% endif %}
